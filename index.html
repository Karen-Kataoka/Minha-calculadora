<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Calculadora</title>
    <link rel="stylesheet" href="estilo.css">

</head>
<body>
    <div class="calculadora">
        <h1>Minha Calculadora</h1>

        <form>
            <label for="V1">Valor A</label>
            <input type="number" id="V1" name="V1" step="any" />

            <label for="V2">Valor B</label>
            <input type="number" id="V2" name="V2" step="any" />

            <label for="oper">Operação</label>
            <select id="oper">
                <option value="soma">Soma</option>
                <option value="sub">Subtração</option>
                <option value="mult">Multiplicação</option>
                <option value="div">Divisão</option>
                <option value="pot">Potenciação</option>
            </select>

            <button type="button" onclick="executar()">Executar</button>
        </form>

        <div id="resultado"></div>
    </div>

    <script src="ROT_MOD1-NC3.js"></script>
    <script>
        const executar = () => {
            const campoA = document.getElementById("V1").value;
            const campoB = document.getElementById("V2").value;
            const saida = document.getElementById("resultado");

            if (campoA === "" || campoB === "") {
                saida.textContent = "Preencha os dois valores.";
                return;
            }

            const a = parseFloat(campoA);
            const b = parseFloat(campoB);
            const oper = document.getElementById("oper").value;

            let resultado;
            switch (oper) {
                case "soma": resultado = somar(a, b); break;
                case "sub":  resultado = subtrair(a, b); break;
                case "mult": resultado = multiplicar(a, b); break;
                case "div":  resultado = dividir(a, b); break;
                case "pot":  resultado = exponencial(a, b); break;
            }

            saida.textContent = typeof resultado === "string"
                ? resultado
                : `O resultado da operação é: ${resultado}`;
        };
    </script>
</body>
</html>
